name: wellman

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install immutable Wellman runtime
        run: python -m pip install 'wellman @ git+https://github.com/wellmanifest/wellman.git@747eff3c5c6d435eed64c6635c4663a79e163635'
      - name: Validate adopted requirements and Docs metadata
        run: python scripts/check-wellman.py
